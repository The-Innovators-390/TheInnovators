name: Burndown (Project v2)

on:
  workflow_dispatch:
    inputs:
      sprint_name:
        description: "Sprint field value"
        required: true
        default: "Sprint 5"
      sprint_start:
        description: "Sprint start date (YYYY-MM-DD)"
        required: true
        default: "2026-03-08"
      sprint_end:
        description: "Sprint end date (YYYY-MM-DD)"
        required: true
        default: "2026-03-22"

  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  burndown:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.BURNDOWN_TOKEN }}
      OWNER: The-Innovators-390
      PROJECT_NUMBER: "1"
      POINTS_FIELD_NAME: "Estimate"
      STATUS_FIELD_NAME: "Status"
      DONE_STATUS_NAME: "Closed"
      SPRINT_FIELD_NAME: "Sprint"
      INITIAL_POINTS: "110"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate burndown
        env:
          SPRINT_NAME: ${{ inputs.sprint_name }}
          SPRINT_START: ${{ inputs.sprint_start }}
          SPRINT_END: ${{ inputs.sprint_end }}
        run: |
          set -e
          mkdir -p data

          SAFE=$(echo "$SPRINT_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/ /_/g')
          CSV="data/burndown_${SAFE}.csv"
          PNG="data/burndown_${SAFE}.png"

          cat > project_query.json <<EOF
          {
            "query": "query { organization(login: \"$OWNER\") { projectV2(number: $PROJECT_NUMBER) { id title } } }"
          }
          EOF

          RAW=$(curl -sS \
            -H "Authorization: bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            --data @project_query.json \
            https://api.github.com/graphql)

          echo "Project query response:"
          echo "$RAW"

          PROJECT_ID=$(RAW_JSON="$RAW" python3 - <<'PY'
          import json, os, sys
          raw = os.environ["RAW_JSON"]
          j = json.loads(raw)

          if "errors" in j:
              print(json.dumps(j["errors"], indent=2), file=sys.stderr)
              raise SystemExit("GraphQL project query failed.")

          org = (j.get("data") or {}).get("organization")
          if not org:
              raise SystemExit("No organization returned. Token may not have org project access.")

          proj = org.get("projectV2")
          if not proj:
              raise SystemExit("No projectV2 returned. Check PROJECT_NUMBER.")

          print(proj["id"])
          PY
          )

          echo "Resolved PROJECT_ID=$PROJECT_ID"

          cat > items_query.json <<EOF
          {
            "query": "query(\$id: ID!) { node(id: \$id) { ... on ProjectV2 { items(first: 100) { nodes { fieldValues(first: 50) { nodes { ... on ProjectV2ItemFieldNumberValue { number field { ... on ProjectV2FieldCommon { name } } } ... on ProjectV2ItemFieldSingleSelectValue { name field { ... on ProjectV2FieldCommon { name } } } ... on ProjectV2ItemFieldTextValue { text field { ... on ProjectV2FieldCommon { name } } } } } } } } } }",
            "variables": {
              "id": "$PROJECT_ID"
            }
          }
          EOF

          RESP=$(curl -sS \
            -H "Authorization: bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            --data @items_query.json \
            https://api.github.com/graphql)

          echo "Items query response:"
          echo "$RESP"

          REMAINING=$(RESP_JSON="$RESP" python3 - <<'PY'
          import os, json, sys

          j = json.loads(os.environ["RESP_JSON"])

          if "errors" in j:
              print(json.dumps(j["errors"], indent=2), file=sys.stderr)
              raise SystemExit("GraphQL items query failed.")

          data = j.get("data")
          if not data:
              raise SystemExit("No data returned from items query.")

          node = data.get("node")
          if not node:
              raise SystemExit("No project node returned from items query.")

          items = (((node.get("items") or {}).get("nodes")) or [])

          POINT = os.environ["POINTS_FIELD_NAME"]
          STATUS = os.environ["STATUS_FIELD_NAME"]
          DONE = os.environ["DONE_STATUS_NAME"]
          SPRINT = os.environ["SPRINT_FIELD_NAME"]
          SPRINT_NAME = os.environ["SPRINT_NAME"]
          INITIAL_POINTS: "110"

          remaining = 0.0

          for item in items:
              pts = 0.0
              status = None
              sprint = None

              field_values = (((item.get("fieldValues") or {}).get("nodes")) or [])
              for f in field_values:
                  field = f.get("field") or {}
                  field_name = field.get("name")

                  if field_name == POINT and f.get("number") is not None:
                      pts = float(f["number"])

                  if field_name == STATUS:
                      if f.get("name") is not None:
                          status = f["name"]
                      elif f.get("text") is not None:
                          status = f["text"]

                  if field_name == SPRINT:
                      if f.get("name") is not None:
                          sprint = f["name"]
                      elif f.get("text") is not None:
                          sprint = f["text"]

              if sprint == SPRINT_NAME and status != DONE:
                  remaining += pts

          print(int(remaining) if remaining.is_integer() else remaining)
          PY
          )

          echo "Remaining points: $REMAINING"

          TODAY=$(date -u +%F)

          if [ ! -f "$CSV" ]; then
            echo "date,remaining_points" > "$CSV"
          fi

          grep -v "^$TODAY," "$CSV" > tmp.csv || true
          mv tmp.csv "$CSV"
          echo "$TODAY,$REMAINING" >> "$CSV"

          python3 - <<'PY'
          import csv
          import datetime
          import json
          import os
          import urllib.parse

          sprint = os.environ["SPRINT_NAME"]
          start = datetime.date.fromisoformat(os.environ["SPRINT_START"])
          end = datetime.date.fromisoformat(os.environ["SPRINT_END"])
          initial_points = float(os.environ["INITIAL_POINTS"])

          safe = sprint.lower().replace(" ", "_")
          csv_file = f"data/burndown_{safe}.csv"

          rows = list(csv.DictReader(open(csv_file)))
          actual_map = {row["date"]: float(row["remaining_points"]) for row in rows}

          dates = []
          actual = []

          d = start
          while d <= end:
              ds = str(d)
              dates.append(ds)
              actual.append(actual_map.get(ds, None))
              d += datetime.timedelta(days=1)

          total_days = (end - start).days
          ideal = []
          for i in range(len(dates)):
              if total_days == 0:
                  ideal.append(initial_points)
              else:
                  ideal.append(max(0.0, initial_points - (initial_points / total_days) * i))

          config = {
              "type": "line",
              "data": {
                  "labels": dates,
                  "datasets": [
                      {
                          "label": "Actual Remaining",
                          "data": actual,
                          "spanGaps": True
                      },
                      {
                          "label": "Ideal Burndown",
                          "data": ideal
                      }
                  ]
              },
              "options": {
                  "plugins": {
                      "title": {
                          "display": True,
                          "text": f"Burndown - {sprint}"
                      }
                  },
                  "scales": {
                      "y": {
                          "beginAtZero": True
                      }
                  }
              }
          }

          url = "https://quickchart.io/chart?c=" + urllib.parse.quote(json.dumps(config))
          with open("data/chart_url.txt", "w") as f:
              f.write(url)
          PY

          curl -sS "$(cat data/chart_url.txt)" -o "$PNG"

      - name: Commit files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/
          git commit -m "Update burndown chart" || exit 0
          git push
