name: Burndown (Project v2)

on:
  workflow_dispatch:
    inputs:
      sprint_name:
        description: "Sprint field value"
        required: true
        default: "Sprint 5"

      sprint_start:
        description: "Sprint start date (YYYY-MM-DD)"
        required: true
        default: "2026-03-08"

      sprint_end:
        description: "Sprint end date (YYYY-MM-DD)"
        required: true
        default: "2026-03-23"

  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  burndown:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.BURNDOWN_TOKEN }}
      OWNER: The-Innovators-390
      PROJECT_NUMBER: "1"

      POINTS_FIELD_NAME: "Estimate"
      STATUS_FIELD_NAME: "Status"
      DONE_STATUS_NAME: "Closed"
      SPRINT_FIELD_NAME: "Sprint"

    steps:
      - uses: actions/checkout@v4

      - name: Generate burndown
        env:
          SPRINT_NAME: ${{ inputs.sprint_name }}
          SPRINT_START: ${{ inputs.sprint_start }}
          SPRINT_END: ${{ inputs.sprint_end }}
        run: |

          mkdir -p data

          SAFE=$(echo "$SPRINT_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/ /_/g')

          CSV="data/burndown_${SAFE}.csv"
          PNG="data/burndown_${SAFE}.png"

          RAW=$(curl -s \
            -H "Authorization: bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"query{ organization(login:\\\"$OWNER\\\"){ projectV2(number:$PROJECT_NUMBER){ id }}}\"}" \
            https://api.github.com/graphql)

          PROJECT_ID=$(echo "$RAW" | jq -r '.data.organization.projectV2.id')

          RESP=$(curl -s \
            -H "Authorization: bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"query($id:ID!){ node(id:$id){ ... on ProjectV2 { items(first:100){ nodes{ fieldValues(first:50){ nodes{ ... on ProjectV2ItemFieldNumberValue{ number field{ name }} ... on ProjectV2ItemFieldSingleSelectValue{ name field{ name }} }}}}}}\",\"variables\":{\"id\":\"$PROJECT_ID\"}}" \
            https://api.github.com/graphql)

          REMAINING=$(echo "$RESP" | python3 - << 'PY'
import os,json,sys

j=json.load(sys.stdin)

POINT=os.environ["POINTS_FIELD_NAME"]
STATUS=os.environ["STATUS_FIELD_NAME"]
DONE=os.environ["DONE_STATUS_NAME"]
SPRINT=os.environ["SPRINT_FIELD_NAME"]
SPRINT_NAME=os.environ["SPRINT_NAME"]

remaining=0

for item in j["data"]["node"]["items"]["nodes"]:
    pts=0
    status=None
    sprint=None

    for f in item["fieldValues"]["nodes"]:
        name=f["field"]["name"]

        if name==POINT and "number" in f:
            pts=f["number"]

        if name==STATUS and "name" in f:
            status=f["name"]

        if name==SPRINT and "name" in f:
            sprint=f["name"]

    if sprint==SPRINT_NAME and status!=DONE:
        remaining+=pts

print(int(remaining))
PY
)

          TODAY=$(date -u +%F)

          if [ ! -f "$CSV" ]; then
            echo "date,remaining_points" > $CSV
          fi

          grep -v "^$TODAY," $CSV > tmp.csv || true
          mv tmp.csv $CSV

          echo "$TODAY,$REMAINING" >> $CSV

          python3 - << 'PY'
import csv,datetime,json,urllib.parse,os

SPRINT=os.environ["SPRINT_NAME"]
START=datetime.date.fromisoformat(os.environ["SPRINT_START"])
END=datetime.date.fromisoformat(os.environ["SPRINT_END"])

safe=SPRINT.lower().replace(" ","_")
CSV=f"data/burndown_{safe}.csv"

rows=list(csv.DictReader(open(CSV)))

actual_dates=[r["date"] for r in rows]
actual_vals=[float(r["remaining_points"]) for r in rows]

total_days=(END-START).days

if actual_vals:
    start_points=actual_vals[0]
else:
    start_points=0

ideal=[]
dates=[]

for i in range(total_days+1):
    d=START+datetime.timedelta(days=i)
    dates.append(str(d))

    if total_days==0:
        ideal.append(start_points)
    else:
        ideal.append(max(0,start_points-(start_points/total_days)*i))

config={
"type":"line",
"data":{
"labels":dates,
"datasets":[
{"label":"Actual Remaining","data":actual_vals},
{"label":"Ideal Burndown","data":ideal}
]},
"options":{
"plugins":{"title":{"display":True,"text":f"Burndown - {SPRINT}"}},
"scales":{"y":{"beginAtZero":True}}
}
}

url="https://quickchart.io/chart?c="+urllib.parse.quote(json.dumps(config))

open("data/chart_url.txt","w").write(url)
PY

          curl -s "$(cat data/chart_url.txt)" -o $PNG

      - name: Commit files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add data/

          git commit -m "Update burndown chart" || exit 0
          git push
