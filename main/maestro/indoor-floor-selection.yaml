appId: com.theinnovators.campusguide
---
- launchApp
- waitForAnimationToEnd

# Welcome Screen -> Guest
- runFlow:
    when:
      visible:
        id: "guest-sign-in-button"
    commands:
      - tapOn:
          id: "guest-sign-in-button"

# Map loaded
- extendedWaitUntil:
    visible:
      id: "campusMap-root"
    timeout: 20000
- assertVisible:
    id: "campusToggle"
- extendedWaitUntil:
    visible:
      id: "campusToggle-SGW"
      selected: true
    timeout: 10000

# Open Hall building popup via search
- tapOn:
    id: "searchInput"
- eraseText
- inputText: "Henry"
- extendedWaitUntil:
    visible:
      id: "suggestion-SGW-SGW-H"
    timeout: 10000
- tapOn:
    id: "suggestion-SGW-SGW-H"
- waitForAnimationToEnd
- hideKeyboard
- tapOn:
    id: "mapView"
- waitForAnimationToEnd

# Expand building popup (bottom sheet) so the Indoor Map button is tappable
# Swipe to expand popup (bottom sheet) until Indoor Map button appears
- swipe:
    start: "50%, 75%"
    end: "50%, 55%"
    duration: 800
- waitForAnimationToEnd
- swipe:
    start: "50%, 75%"
    end: "50%, 30%"
    duration: 800
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Indoor Map"
    timeout: 20000
- tapOn:
    text: "Indoor Map"

# Indoor screen shows floor selector and default floor label
- extendedWaitUntil:
    visible:
      id: "indoor-floor-selector"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "indoor-current-floor"
    timeout: 10000

# Switch floors and verify selection state + label update
- tapOn:
    id: "indoor-floor-8"
- waitForAnimationToEnd
- assertVisible: "Floor: 8"

- tapOn:
    id: "indoor-floor-2"
- waitForAnimationToEnd
- assertVisible: "Floor: 2"

# Go back to map and open a building with no indoor maps (EV)
- back
- extendedWaitUntil:
    visible:
      id: "campusMap-root"
    timeout: 10000
- tapOn:
    id: "searchInput"
- eraseText
- inputText: "EV"
- extendedWaitUntil:
    visible:
      id: "suggestion-SGW-SGW-EV"
    timeout: 10000
- tapOn:
    id: "suggestion-SGW-SGW-EV"
- waitForAnimationToEnd
- hideKeyboard
- waitForAnimationToEnd

# Expand building popup by swiping until expanded content shows
- swipe:
    start: "50%, 70%"
    end: "50%, 55%"
    duration: 800
- waitForAnimationToEnd
- swipe:
    start: "50%, 70%"
    end: "50%, 25%"
    duration: 800
- waitForAnimationToEnd
- swipe:
    start: "50%, 70%"
    end: "50%, 15%"
    duration: 800
- waitForAnimationToEnd
- swipe:
    start: "50%, 70%"
    end: "50%, 5%"
    duration: 800
- extendedWaitUntil:
    visible:
      text: "Indoor Map"
    timeout: 30000
- tapOn:
    text: "Indoor Map"

- assertVisible:
    id: "indoor-unavailable-message"
