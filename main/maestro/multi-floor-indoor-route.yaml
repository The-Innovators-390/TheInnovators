appId: com.theinnovators.campusguide
---
- launchApp
- waitForAnimationToEnd

- runFlow:
    when:
      visible:
        id: "guest-sign-in-button"
    commands:
      - tapOn:
          id: "guest-sign-in-button"

- extendedWaitUntil:
    visible:
      id: "campusMap-root"
    timeout: 30000

- tapOn:
    id: "searchInput"
- eraseText
- inputText: "Henry"

- extendedWaitUntil:
    visible:
      id: "suggestion-SGW-SGW-H"
    timeout: 10000
- tapOn:
    id: "suggestion-SGW-SGW-H"

- waitForAnimationToEnd
- hideKeyboard
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Indoor Map"
    timeout: 20000
- tapOn: "Indoor Map"

- extendedWaitUntil:
    visible:
      id: "indoor-floor-selector"
    timeout: 10000

# Start room
- tapOn:
    id: "indoorRouteStartInput"
- eraseText
- inputText: "H-131"

- extendedWaitUntil:
    visible: "H-131"
    timeout: 10000
- tapOn: "H-131"
- waitForAnimationToEnd

# Destination room
- tapOn:
    id: "indoorRouteDestInput"
- eraseText
- inputText: "H-231"

- extendedWaitUntil:
    visible: "H-231"
    timeout: 10000
- tapOn: "H-231"

# Dismiss active editing state by tapping non-input text
- tapOn: "Henry F. Hall Building"
- waitForAnimationToEnd

# Confirm still on indoor map
- assertVisible:
    id: "indoor-floor-selector"

# Switch to floor 2
- tapOn:
    id: "indoor-floor-2"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "indoor-current-floor"
    timeout: 10000

- assertVisible:
    id: "indoor-floor-selector"

# Switch back to floor 1
- tapOn:
    id: "indoor-floor-1"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "indoor-current-floor"
    timeout: 10000

- assertVisible:
    id: "indoor-floor-selector"