appId: com.theinnovators.campusguide
---
- launchApp
- waitForAnimationToEnd

# Welcome Screen - Guest
- assertVisible:
    id: "guest-sign-in-button"
- tapOn:
    id: "guest-sign-in-button"

# Ensure map loaded
- assertVisible:
    id: campusMap-root

# Enter route mode
- tapOn:
    id: routeModeButton
- waitForAnimationToEnd

# Select starting location (Henry F. Hall)
- tapOn:
    id: "routeStartRow"
- inputText: "Henry"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "routeSuggestion-SGW-SGW-H"
    timeout: 10000
- tapOn:
    id: "routeSuggestion-SGW-SGW-H"
- waitForAnimationToEnd

# Select destination (Physical Services Building)
- tapOn:
    id: "routeDestRow"
- inputText: "Physical"
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "routeSuggestion-LOY-LOY-PS"
    timeout: 10000
- tapOn:
    id: "routeSuggestion-LOY-LOY-PS"
- waitForAnimationToEnd

# Wait for route preview / travel popup
- extendedWaitUntil:
    visible:
      id: "travelPopup-handle"
    timeout: 20000

# Start navigation (driving, route index 0)
- extendedWaitUntil:
    timeout: 30000
    visible:
      id: "go-driving-0"
- tapOn:
    id: "go-driving-0"
- waitForAnimationToEnd

# Assert directions appear
- assertVisible:
    id: directions-panel
- assertVisible:
    id: directions-street

# Exit (works for both directions-only and live navigation)
- runFlow:
    when:
      visible:
        id: "exit-btn-live"
    commands:
      - tapOn:
          id: "exit-btn-live"
      - waitForAnimationToEnd

- runFlow:
    when:
      visible:
        id: "exit-btn-directions"
    commands:
      - tapOn:
          id: "exit-btn-directions"
      - waitForAnimationToEnd

# Assert directions disappear
- assertNotVisible:
    id: directions-panel
